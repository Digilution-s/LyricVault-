<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E86389" />
      <stop offset="100%" stop-color="#D4496F" />
    </linearGradient>

    <!-- Feather Gradient (Deep Burgundy to Orange-Yellow Glow Tip) -->
    <linearGradient id="featherGrad" x1="65%" y1="10%" x2="25%" y2="90%">
      <stop offset="0%" stop-color="#4A0619" />
      <stop offset="40%" stop-color="#6B0A26" />
      <stop offset="70%" stop-color="#B8222B" />
      <stop offset="88%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D000B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Square Canvas (Pink / Rose) -->
  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Main Quill Feather Body & Stem -->
    <path d="M 340,75 
             C 325,100 300,125 285,150 
             C 270,140 250,150 235,170
             C 220,190 205,225 200,260
             C 190,290 192,320 188,360
             C 186,380 182,410 178,432
             L 186,430
             C 195,400 202,370 215,340
             C 225,315 240,290 260,265
             C 280,240 305,200 322,165
             C 335,135 348,105 340,75 Z" 
          fill="url(#featherGrad)" />

    <!-- Feather Outer Plume Ribs & Notches -->
    <path d="M 340,75
             C 300,95 245,135 210,190
             C 198,210 196,230 208,242
             C 195,260 192,285 190,325
             L 186,430
             C 202,390 218,355 242,320
             C 232,310 236,295 252,278
             C 285,242 320,185 340,115
             C 322,138 310,152 306,165
             C 318,138 332,102 340,75 Z"
          fill="url(#featherGrad)" />
  </g>

  <!-- Treble Clef Golden Music Ribbon Swirl -->
  <g filter="url(#shadow)">
    <!-- Base Ribbon Line -->
    <path d="M 162,422
             C 210,408 255,388 295,355
             C 330,326 385,280 376,340
             C 368,382 320,412 265,398
             C 232,390 220,360 232,335
             C 245,308 278,302 298,322
             C 312,336 304,360 285,362
             C 268,364 258,348 266,336
             C 272,326 288,328 290,338"
          fill="none"
          stroke="#FFF5C2"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
